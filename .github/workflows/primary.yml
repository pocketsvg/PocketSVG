name: CI

on:
  push:
    branches: [master]
    tags:
      - '*' # run on every tag
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

jobs:
  primary:
    name: Primary
    timeout-minutes: 30
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build demos
        run: bash ci/build_demos.sh

      - name: Run unit tests
        run: bash ci/test.sh

  spm:
    name: macOS tests (Swift Package Manager)
    timeout-minutes: 30
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test (Debug)
        run: swift test
      - name: Test (Release)
        run: swift test -c release

  cocoapods:
    name: Cocoapods
    timeout-minutes: 30
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Lint Podspec
        run: pod lib lint --allow-warnings
